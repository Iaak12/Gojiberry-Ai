<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 15px; font-family: sans-serif; }
    input { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #3B82F6; color: white; border: none; cursor: pointer; border-radius: 4px; }
    .status { margin-top: 15px; font-size: 14px; color: #555; }
  </style>
</head>
<body>
  <h3>Gojiberry Auto</h3>
  <p>Link your account to automate LinkedIn campaigns safely from your browser.</p>
  <input type="email" id="email" placeholder="Your Gojiberry Email" />
  <button id="saveBtn">Save & Start</button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
